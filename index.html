<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寄生蟲跑台翻卡練習</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
        }

        h2 { color: #333; margin: 20px 0; }

        /* --- 卡片區塊 (遊戲進行中) --- */
        .game-area {
            perspective: 600px;
            width: 300px;
            height: 450px;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .card__face--front { background: #ffffff; }
        .card__face--back { background: #f8f9fa; transform: rotateY(180deg); text-align: center; }

        .parasite-img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        input[type="text"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        
        .restart-btn {
            background-color: #28a745;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
        }
        .restart-btn:hover { background-color: #218838; }

        .result-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        
        .answer-detail { font-size: 18px; color: #555; margin-bottom: 20px; }
        .progress { margin-top: 10px; font-size: 14px; color: #666; }

        /* --- 成績單區塊 (結束後顯示) --- */
        #summary-section {
            display: none; /* 預設隱藏 */
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .summary-header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            padding: 10px 0;
        }
        
        /* 標記錯誤的題目背景色 */
        .summary-item.item-wrong {
            background-color: #fff0f0;
            border-left: 5px solid #dc3545;
            padding-left: 10px;
        }

        .summary-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-right: 15px;
            cursor: pointer;
        }

        .summary-info { flex: 1; }
        .summary-info h4 { margin: 0 0 5px 0; color: #333; }
        .summary-info span { font-size: 14px; color: #666; }
        
        .status-badge {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .status-badge.ok { background-color: #d4edda; color: #155724; }
        .status-badge.no { background-color: #f8d7da; color: #721c24; }

    </style>
</head>
<body>

    <h2>🔬 寄生蟲跑台練習</h2>

    <div class="game-area" id="game-section">
        <div class="card" id="flashcard">
            <div class="card__face card__face--front">
                <div style="margin-bottom:10px; color:#666;">請輸入正確名稱：</div>
                <img src="" alt="題目圖片" class="parasite-img" id="q-image">
                <input type="text" id="user-input" placeholder="例如：蛔蟲" autocomplete="off">
                <button onclick="checkAnswer()">送出</button>
            </div>

            <div class="card__face card__face--back">
                <div id="result-title" class="result-text"></div>
                <div class="answer-detail">
                    正確答案：<br>
                    <strong id="correct-answer" style="color: #333; font-size: 22px;"></strong>
                </div>
                <button onclick="nextQuestion()" id="next-btn">下一題 ➡️</button>
            </div>
        </div>
        <div class="progress" id="progress-text">準備開始...</div>
    </div>

    <div id="summary-section">
        <div class="summary-header">
            <h3>測驗結束！成績單</h3>
            <p id="final-score" style="font-size: 1.2em; font-weight: bold;"></p>
            <button class="restart-btn" onclick="initGame()">再玩一次 🔄</button>
        </div>
        <div id="summary-list">
            </div>
    </div>

    <script>
        // ==========================================
        // 資料庫設定區 (請在這裡修改你的題目)
        // ans 如果有多個答案，請用 ["答案1", "答案2"] 
        // ==========================================
        const database = [
            { id: 1, img: "images/1.jpg", ans: ["寄生蟲1", "虫1"] },
            { id: 2, img: "images/2.jpg", ans: ["寄生蟲2"] },
            { id: 3, img: "images/3.jpg", ans: ["寄生蟲3"] }
        ];
        // ==========================================

        let questions = [];     // 洗牌後的題目
        let userRecords = [];   // 使用者的作答紀錄 (用來生成成績單)
        let currentIdx = 0;
        let score = 0;

        // DOM 元素
        const gameSection = document.getElementById('game-section');
        const summarySection = document.getElementById('summary-section');
        const summaryList = document.getElementById('summary-list');
        const finalScoreEl = document.getElementById('final-score');
        
        const card = document.getElementById('flashcard');
        const imgEl = document.getElementById('q-image');
        const inputEl = document.getElementById('user-input');
        const resultTitle = document.getElementById('result-title');
        const correctAnswerEl = document.getElementById('correct-answer');
        const nextBtn = document.getElementById('next-btn');
        const progressEl = document.getElementById('progress-text');

        // 洗牌函數
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化
        function initGame() {
            gameSection.style.display = "block";
            summarySection.style.display = "none";
            
            questions = shuffle([...database]); // 複製並洗牌
            userRecords = []; // 清空紀錄
            currentIdx = 0;
            score = 0;
            
            loadCard();
        }

        // 載入卡片
        function loadCard() {
            const q = questions[currentIdx];
            imgEl.src = q.img;
            imgEl.onerror = function() { this.alt = "找不到圖片：" + q.img; };

            inputEl.value = "";
            progressEl.innerText = `進度：${currentIdx + 1} / ${questions.length}`;
            card.classList.remove('is-flipped');
            
            setTimeout(() => inputEl.focus(), 300);
        }

        // 檢查答案
        function checkAnswer() {
            const userVal = inputEl.value.trim().toLowerCase();
            // 處理多種答案的情況
            let correctVals = questions[currentIdx].ans;
            if (!Array.isArray(correctVals)) correctVals = [correctVals];
            
            // 比對 (全部轉小寫)
            const isCorrect = correctVals.some(ans => ans.toLowerCase() === userVal);
            
            // 記錄這一題的結果 (為了成績單)
            userRecords.push({
                question: questions[currentIdx],
                userAnswer: userVal,
                isCorrect: isCorrect,
                correctAnswers: correctVals[0] // 顯示第一個主要答案
            });

            if (isCorrect) {
                resultTitle.innerHTML = "✅ 答對了！";
                resultTitle.className = "result-text correct";
                score++;
            } else {
                resultTitle.innerHTML = "❌ 答錯了！";
                resultTitle.className = "result-text wrong";
            }

            correctAnswerEl.innerText = correctVals[0];
            card.classList.add('is-flipped');

            // 設定按鈕文字
            if (currentIdx >= questions.length - 1) {
                nextBtn.innerText = "看成績單 📝";
            } else {
                nextBtn.innerText = "下一題 ➡️";
            }
            nextBtn.focus();
        }

        // 下一題或結束
        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                card.classList.remove('is-flipped');
                setTimeout(() => loadCard(), 300);
            } else {
                showSummary();
            }
        }

        // 顯示成績單
        function showSummary() {
            gameSection.style.display = "none"; // 隱藏遊戲區
            summarySection.style.display = "block"; // 顯示成績單區

            finalScoreEl.innerText = `總分：${score} / ${questions.length}`;
            summaryList.innerHTML = ""; // 清空舊內容

            // 產生列表
            userRecords.forEach((record, index) => {
                const itemDiv = document.createElement('div');
                // 如果答錯，加上紅色背景樣式
                const rowClass = record.isCorrect ? "summary-item" : "summary-item item-wrong";
                const badgeHtml = record.isCorrect 
                    ? `<span class="status-badge ok">正確</span>` 
                    : `<span class="status-badge no">錯誤</span>`;

                itemDiv.className = rowClass;
                itemDiv.innerHTML = `
                    <img src="${record.question.img}" class="summary-thumb" onclick="window.open(this.src)" title="點擊看大圖">
                    <div class="summary-info">
                        <h4>第 ${index + 1} 題：${record.correctAnswers}</h4>
                        <span>你的回答：${record.userAnswer || "(未作答)"}</span>
                    </div>
                    ${badgeHtml}
                `;
                summaryList.appendChild(itemDiv);
            });
        }

        // 支援 Enter
        inputEl.addEventListener("keypress", function(event) {
            if (event.key === "Enter") checkAnswer();
        });

        // 啟動
        initGame();

    </script>
</body>
</html>
